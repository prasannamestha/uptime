# Change these first
owner: prasannamestha # Your GitHub organization or username, where this repository lives
repo: uptime # The name of this repository

sites:
  # r.installsafe.io sits in every customer's install path — this is the one
  # that pages. /-/ping is the registry's unauthenticated health path.
  - name: InstallSafe Registry (r.installsafe.io)
    url: https://r.installsafe.io/-/ping
  # Web app + API health. expectedStatusCodes guards against a 200 that isn't
  # actually healthy: /api/health returns non-200 when the app is broken.
  - name: InstallSafe Web (installsafe.io)
    url: https://installsafe.io
  - name: InstallSafe API health (advisory mirror)
    url: https://installsafe.io/api/health
  # Legacy domain kept while any customer still points at it.
  - name: PrivJs Safe UI (legacy)
    url: https://safe.privjs.com

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  baseUrl: /uptime
  logoUrl: https://installsafe.io/favicon.ico
  name: InstallSafe Status
  introTitle: "**InstallSafe** status — registry proxy, web app, and advisory pipeline."
  introMessage: Live uptime for [InstallSafe](https://installsafe.io), checked every 5 minutes from GitHub Actions.
  navbar:
    - title: Status
      href: /uptime
    - title: installsafe.io
      href: https://installsafe.io

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
